<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaserPrint Arcade - DTF TEXTIL / UV</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/uploads/fotos/LOGOTIPO.png">

  <!-- FUENTES RETRO & TECH -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <!-- PDF.JS LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

  <!-- ESTILOS ARCADE DE LA SECCIÓN -->
  <link rel="stylesheet" href="dtf.css">
</head>
<body data-categoria="DTF TEXTIL / UV">

  <!-- ENCABEZADO ESTILO HUD / ARCADE -->
  <header class="retro-header">
    <div class="header-logo-container">
      <a href="index.html">
        <img src="/uploads/fotos/LOGOTIPO.png" alt="LaserPrint Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x50/000/00f0ff?text=LASERPRINT';">
      </a>
    </div>

    <!-- MENÚ MÓVIL TOGGLE -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir Menú">
      <span></span><span></span><span></span>
    </button>

    <nav id="navLinks">
      <a href="index.html" class="nav-btn arcade-sound-hover">INICIO</a>
      <a href="dtf.html" class="nav-btn active arcade-sound-hover">DTF TEXTIL / UV</a>
      <a href="sublimacion.html" class="nav-btn arcade-sound-hover">SUBLIMACIÓN</a>
      <a href="lona.html" class="nav-btn arcade-sound-hover">LONA</a>
      <a href="coroplast.html" class="nav-btn arcade-sound-hover">COROPLAST</a>
      <a href="cortelaser.html" class="nav-btn arcade-sound-hover">CORTE LÁSER</a>
      <a href="vinil.html" class="nav-btn arcade-sound-hover">VINIL</a>
    </nav>
  </header>

  <main class="main-container">
    <!-- TITULO NEÓN ARCADE -->
    <section class="hero-section">
      <h1 class="pixel-title">SELECT CATEGORY: DTF TEXTIL / UV</h1>
      <p class="pixel-subtitle">STAGE 01 - IMPRESIÓN DE ALTA RESOLUCIÓN Y ADHERENCIA</p>
    </section>

    <!-- PESTAÑAS DE NAVEGACIÓN DIRECTA -->
    <div class="tabs-container">
      <button class="tab-btn active arcade-sound-btn" data-tab="imagenes">
        <span class="tab-icon">🖼️</span> GALERÍA
      </button>
      <button class="tab-btn arcade-sound-btn" data-tab="videos">
        <span class="tab-icon">🎬</span> DEMOS VIDEO
      </button>
      <button class="tab-btn arcade-sound-btn" data-tab="pdfs">
        <span class="tab-icon">📄</span> CATÁLOGOS PDF
      </button>
    </div>

    <!-- SECCIÓN IMÁGENES -->
    <section id="sec-imagenes" class="media-section">
      <h2 class="section-title"><span>🖼️</span> MUESTRAS DE TRABAJO (GALERÍA)</h2>
      <div id="gridImagenes" class="pixel-grid"></div>
    </section>

    <!-- SECCIÓN VIDEOS -->
    <section id="sec-videos" class="media-section" style="display: none;">
      <h2 class="section-title"><span>🎬</span> PROCESOS Y DEMOSTRACIONES (VIDEOS)</h2>
      <div id="gridVideos" class="pixel-grid"></div>
    </section>

    <!-- SECCIÓN PDFS -->
    <section id="sec-pdfs" class="media-section" style="display: none;">
      <h2 class="section-title"><span>📄</span> DOCUMENTOS Y PLANTILLAS (CATÁLOGOS PDF)</h2>
      <div id="gridPdfs" class="pixel-grid"></div>
    </section>
  </main>

  <!-- LIGHTBOX / VISOR MODAL RETRO -->
  <div id="mediaModal" class="pixel-modal">
    <span class="close-modal arcade-sound-btn" id="closeModal">&times;</span>
    <div class="modal-content-wrapper">
      <div id="modalBody"></div>
      <p id="captionModal" class="modal-caption"></p>
    </div>
  </div>

  <!-- LÓGICA DE CONTROL -->
  <script src="dtf.js"></script>
</body>
</html>
