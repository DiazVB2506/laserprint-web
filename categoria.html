<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaserPrint - Sección</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; }
    header { background: #111; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav { background: #222; padding: 10px; display: flex; gap: 15px; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 4px; }
    nav a:hover, nav a.active { background: #007bff; }
    .container { padding: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img, .card video { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    .price { color: #27ae60; font-weight: bold; font-size: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>LaserPrint</h1>
    <a href="login.html" style="background:#e74c3c; color:white; padding:8px 15px; text-decoration:none; border-radius:4px; font-weight:bold;">Iniciar Sesión Admin</a>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="categoria.html?cat=DTF TEXTIL / UV">DTF TEXTIL / UV</a>
    <a href="categoria.html?cat=SUBLIMACION">SUBLIMACION</a>
    <a href="categoria.html?cat=LONA">LONA</a>
    <a href="categoria.html?cat=COROPLAST">COROPLAST</a>
    <a href="categoria.html?cat=CORTE LASER">CORTE LASER</a>
    <a href="categoria.html?cat=VINIL">VINIL</a>
  </nav>

  <div class="container">
    <h2 id="tituloArea">Cargando área...</h2>
    <div id="gridArea" class="grid"></div>
  </div>

  <script>
    // Detectar si está en localhost o producción
    const BACKEND_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://laserprint-api.onrender.com';

    const urlParams = new URLSearchParams(window.location.search);
    const categoria = urlParams.get('cat');

    const titulo = document.getElementById('tituloArea');
    if (titulo) {
      titulo.textContent = `Sección: ${categoria || 'General'}`;
    }

    // Iluminar enlace activo en la navegación
    document.querySelectorAll('nav a').forEach(link => {
      if (link.getAttribute('href') === `categoria.html?cat=${encodeURIComponent(categoria || '')}`) {
        link.classList.add('active');
      }
    });

    function escapeText(str) {
      return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) : '';
    }

    async function cargarContenido() {
      const grid = document.getElementById('gridArea');
      if (!grid) return;

      if (!categoria) {
        grid.innerHTML = '<p>Por favor selecciona una categoría válida.</p>';
        return;
      }

      try {
        const res = await fetch(`${BACKEND_BASE}/api/productos?categoria=${encodeURIComponent(categoria)}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        const data = await res.json();
        const productos = Array.isArray(data) ? data : (data.productos || []);

        grid.innerHTML = '';

        if (productos.length === 0) {
          grid.innerHTML = '<p>No hay publicaciones en esta área por el momento.</p>';
          return;
        }

        productos.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';

          const tipo = (p.tipoArchivo || '').toLowerCase();
          let mediaHTML = '';

          if (tipo.includes('image') || tipo.includes('jpg') || tipo.includes('png')) {
            mediaHTML = `<img src="${escapeText(p.archivoUrl)}" alt="${escapeText(p.nombre)}">`;
          } else if (tipo.includes('video') || tipo.includes('mp4')) {
            mediaHTML = `<video controls src="${escapeText(p.archivoUrl)}"></video>`;
          } else if (tipo.includes('pdf')) {
            mediaHTML = `<p><a href="${escapeText(p.archivoUrl)}" target="_blank" rel="noopener">📄 Ver Documento PDF</a></p>`;
          }

          const precioHTML = p.precio ? `<p class="price">$${p.precio}</p>` : '';

          card.innerHTML = `
            ${mediaHTML}
            <h3>${escapeText(p.nombre)}</h3>
            <p>${escapeText(p.descripcion)}</p>
            ${precioHTML}
          `;

          grid.appendChild(card);
        });
      } catch (err) {
        console.error('Error al cargar categoría:', err);
        grid.innerHTML = '<p>Error de conexión al cargar la sección.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', cargarContenido);
  </script>
</body>
</html>
