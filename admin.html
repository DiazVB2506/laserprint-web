<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaserPrint - Panel Admin</title>

  <!-- Favicon e Iconos -->
  <link rel="icon" type="image/png" href="uploads/fotos/LOGOTIPO.png">

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS externo -->
  <link rel="stylesheet" href="admin.css">

  <!-- Verificación inmediata de sesión antes de renderizar la página -->
  <script>
    if (localStorage.getItem('adminAutenticado') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <!-- Fondo ambiental con orbes claros -->
  <div class="bg-glow ambient-cyan"></div>
  <div class="bg-glow ambient-magenta"></div>

  <!-- Encabezado del Panel -->
  <header class="admin-header glass-card">
    <div class="header-brand">
      <img src="uploads/fotos/LOGOTIPO.png" alt="Logo LaserPrint" class="admin-logo" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/diazvb2506/laserprint-web/main/uploads/fotos/LOGOTIPO.png';">
      <h1 class="header-title">Panel de Administración</h1>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn-site">🌐 Ver Sitio Web</a>
      <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="admin-container">

    <!-- Tarjeta del Formulario (Creación) -->
    <section class="form-box glass-card">
      <div class="form-header">
        <h2>Nueva Publicación</h2>
        <p class="form-subtitle">Sube y gestiona el contenido de tus diferentes secciones</p>
      </div>
      
      <form id="uploadForm" autocomplete="off">
        <div class="form-group">
          <label for="nombre">Nombre del Producto / Servicio</label>
          <input type="text" id="nombre" name="nombre" required maxlength="120" placeholder="Ej. Impresión DTF Playera Negra">
        </div>
        
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="4" required maxlength="1000" placeholder="Escribe los detalles, dimensiones o características principales..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="precio">Precio en Pesos (MXN)</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" placeholder="0.00 (Opcional)">
          </div>

          <div class="form-group flex-1">
            <label for="categoria">Sección de Destino</label>
            <select id="categoria" name="categoria" required>
              <option value="DTF TEXTIL / UV">DTF TEXTIL / UV</option>
              <option value="SUBLIMACION">SUBLIMACION</option>
              <option value="LONA">LONA</option>
              <option value="COROPLAST">COROPLAST</option>
              <option value="CORTE LASER">CORTE LASER</option>
              <option value="VINIL">VINIL</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="archivo">Archivo Multimedia (Imagen, Video o PDF)</label>
          <div class="file-input-wrapper">
            <input type="file" id="archivo" name="archivo" accept="image/jpeg,image/png,image/webp,video/mp4,application/pdf" required>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-save">Subir y Publicar</button>
      </form>
    </section>

    <!-- Tarjeta de Gestión (Buscador, Pestañas por Sección y Tabla) -->
    <section class="table-box glass-card">
      <div class="table-header-tools">
        <h2>📋 Publicaciones Activas</h2>
        
        <!-- Buscador inteligente en tiempo real con sugerencias -->
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre o descripción..." autocomplete="off">
          <ul id="searchSuggestions" class="suggestions-list"></ul>
        </div>
      </div>

      <!-- Pestañas para separar la tabla por secciones -->
      <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" data-cat="TODAS">TODAS</button>
        <button class="tab-btn" data-cat="DTF TEXTIL / UV">DTF TEXTIL / UV</button>
        <button class="tab-btn" data-cat="SUBLIMACION">SUBLIMACION</button>
        <button class="tab-btn" data-cat="LONA">LONA</button>
        <button class="tab-btn" data-cat="COROPLAST">COROPLAST</button>
        <button class="tab-btn" data-cat="CORTE LASER">CORTE LASER</button>
        <button class="tab-btn" data-cat="VINIL">VINIL</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Sección</th>
              <th>Precio (MXN)</th>
              <th>Tipo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Modal Flotante para Edición de Publicaciones -->
  <div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2>✏️ Editar Publicación</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <form id="editForm">
        <input type="hidden" id="editId">

        <div class="form-group">
          <label for="editNombre">Nombre del Producto / Servicio</label>
          <input type="text" id="editNombre" name="nombre" required maxlength="120">
        </div>

        <div class="form-group">
          <label for="editDescripcion">Descripción</label>
          <textarea id="editDescripcion" name="descripcion" rows="3" required maxlength="1000"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="editPrecio">Precio (MXN)</label>
            <input type="number" id="editPrecio" name="precio" step="0.01" min="0">
          </div>

          <div class="form-group flex-1">
            <label for="editCategoria">Sección de Destino</label>
            <select id="editCategoria" name="categoria" required>
              <option value="DTF TEXTIL / UV">DTF TEXTIL / UV</option>
              <option value="SUBLIMACION">SUBLIMACION</option>
              <option value="LONA">LONA</option>
              <option value="COROPLAST">COROPLAST</option>
              <option value="CORTE LASER">CORTE LASER</option>
              <option value="VINIL">VINIL</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="editArchivo">Remplazar Archivo (Opcional)</label>
          <div class="file-input-wrapper">
            <input type="file" id="editArchivo" name="archivo" accept="image/jpeg,image/png,image/webp,video/mp4,application/pdf">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnCancelEdit" class="btn-cancel">Cancelar</button>
          <button type="submit" id="btnSaveEdit" class="btn-save">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script del Administrador con versión anti-caché -->
  <script src="admin.js?v=2.0"></script>
</body>
</html>
