<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Diseño Laser Print</title>

  <!-- El panel nunca debe aparecer en Google -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">

  <!-- Tema (mismo que el sitio) antes de pintar, para evitar el parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Redirección rápida si no hay sesión. OJO: esto NO es seguridad,
       la protección real tiene que estar en el servidor. -->
  <script>
    try {
      if (localStorage.getItem('adminAutenticado') !== 'true' && !localStorage.getItem('adminToken')) {
        window.location.replace('login.html');
      }
    } catch (e) {}
  </script>

  <link rel="icon" type="image/png" href="uploads/fotos/LOGOTIPO.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css?v=4.0">
</head>
<body>

  <div class="bg-glow ambient-cyan" aria-hidden="true"></div>
  <div class="bg-glow ambient-magenta" aria-hidden="true"></div>

  <!-- ===== Encabezado ===== -->
  <header class="admin-header">
    <div class="header-inner">
      <a href="index.html" class="header-brand" aria-label="Ir al sitio de Diseño Laser Print">
        <img src="uploads/fotos/LOGOTIPO.png" alt="" class="admin-logo"
             onerror="this.onerror=null; this.style.display='none';">
        <span class="header-text">
          <span class="header-kicker">Diseño Laser Print</span>
          <span class="header-title">Panel de Administración</span>
        </span>
      </a>

      <div class="header-actions">
        <button type="button" id="themeToggle" class="icon-btn" aria-label="Cambiar tema claro u oscuro">🌙</button>
        <a href="index.html" class="btn btn-ghost" target="_blank" rel="noopener">
          <span aria-hidden="true">↗</span> <span class="hide-sm">Ver sitio</span>
        </a>
        <button type="button" id="logoutBtn" class="btn btn-ghost btn-danger-ghost">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <main class="admin-container">

    <!-- ===== Nueva publicación ===== -->
    <section class="card" aria-labelledby="tituloNueva">
      <div class="card-header">
        <div>
          <h1 id="tituloNueva" class="card-title">Nueva publicación</h1>
          <p class="card-subtitle">Sube fotos, videos o PDF a cada sección del sitio.</p>
        </div>
      </div>

      <form id="uploadForm" class="form-grid" autocomplete="off">
        <div class="form-group span-2">
          <label for="nombre">Nombre del producto o servicio</label>
          <input type="text" id="nombre" name="nombre" required maxlength="120" placeholder="Ej. Playera negra con DTF">
        </div>

        <div class="form-group">
          <label for="categoria">Sección donde aparece</label>
          <select id="categoria" name="categoria" required>
            <option value="DTF TEXTIL / UV">DTF Textil / UV</option>
            <option value="SUBLIMACION">Sublimación</option>
            <option value="LONA">Lona</option>
            <option value="COROPLAST">Coroplast</option>
            <option value="CORTE LASER">Corte Láser</option>
            <option value="VINIL">Vinil</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio <span class="optional">(opcional)</span></label>
          <div class="input-prefix">
            <span aria-hidden="true">$</span>
            <input type="number" id="precio" name="precio" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
            <span aria-hidden="true" class="suffix">MXN</span>
          </div>
        </div>

        <div class="form-group span-2">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3" required maxlength="1000"
                    placeholder="Medidas, material, acabado o detalles que verá el cliente…"></textarea>
          <small class="char-count" data-for="descripcion" aria-live="polite"></small>
        </div>

        <div class="form-group span-2">
          <label for="archivo">Archivo <span class="optional">(JPG, PNG, WEBP, MP4 o PDF)</span></label>
          <div class="dropzone">
            <input type="file" id="archivo" name="archivo" required
                   accept="image/jpeg,image/png,image/webp,video/mp4,application/pdf">
            <div class="file-preview" id="filePreview" hidden></div>
          </div>
        </div>

        <div class="form-actions span-2">
          <button type="reset" class="btn btn-ghost">Limpiar</button>
          <button type="submit" id="btnSubmit" class="btn btn-primary">Subir y publicar</button>
        </div>
      </form>
    </section>

    <!-- ===== Publicaciones ===== -->
    <section class="card" aria-labelledby="tituloLista">
      <div class="card-header table-header-tools">
        <div>
          <h2 id="tituloLista" class="card-title">Publicaciones activas</h2>
          <p class="card-subtitle" id="resumenLista" aria-live="polite">Cargando…</p>
        </div>

        <div class="search-box" role="search">
          <label for="searchInput" class="sr-only">Buscar publicaciones</label>
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="Buscar por nombre o descripción…" autocomplete="off">
          <ul id="searchSuggestions" class="suggestions-list" role="listbox"></ul>
        </div>
      </div>

      <div class="category-tabs" id="categoryTabs" role="toolbar" aria-label="Filtrar por sección">
        <button type="button" class="tab-btn active" data-cat="TODAS" aria-pressed="true">Todas <span class="count"></span></button>
        <button type="button" class="tab-btn" data-cat="DTF TEXTIL / UV" aria-pressed="false">DTF Textil / UV <span class="count"></span></button>
        <button type="button" class="tab-btn" data-cat="SUBLIMACION" aria-pressed="false">Sublimación <span class="count"></span></button>
        <button type="button" class="tab-btn" data-cat="LONA" aria-pressed="false">Lona <span class="count"></span></button>
        <button type="button" class="tab-btn" data-cat="COROPLAST" aria-pressed="false">Coroplast <span class="count"></span></button>
        <button type="button" class="tab-btn" data-cat="CORTE LASER" aria-pressed="false">Corte Láser <span class="count"></span></button>
        <button type="button" class="tab-btn" data-cat="VINIL" aria-pressed="false">Vinil <span class="count"></span></button>
      </div>

      <div class="table-responsive">
        <table>
          <caption class="sr-only">Lista de publicaciones del sitio</caption>
          <thead>
            <tr>
              <th scope="col" class="col-vista">Vista</th>
              <th scope="col">Nombre</th>
              <th scope="col">Sección</th>
              <th scope="col">Precio</th>
              <th scope="col">Tipo</th>
              <th scope="col" class="col-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ===== Modal de edición ===== -->
  <div id="editModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloEditar">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tituloEditar" class="card-title">Editar publicación</h2>
        <button type="button" id="closeModalBtn" class="icon-btn" aria-label="Cerrar">✕</button>
      </div>

      <form id="editForm" class="form-grid" autocomplete="off">
        <input type="hidden" id="editId" name="id">

        <div class="form-group span-2">
          <label for="editNombre">Nombre del producto o servicio</label>
          <input type="text" id="editNombre" name="nombre" required maxlength="120">
        </div>

        <div class="form-group">
          <label for="editCategoria">Sección</label>
          <select id="editCategoria" name="categoria" required>
            <option value="DTF TEXTIL / UV">DTF Textil / UV</option>
            <option value="SUBLIMACION">Sublimación</option>
            <option value="LONA">Lona</option>
            <option value="COROPLAST">Coroplast</option>
            <option value="CORTE LASER">Corte Láser</option>
            <option value="VINIL">Vinil</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editPrecio">Precio <span class="optional">(opcional)</span></label>
          <div class="input-prefix">
            <span aria-hidden="true">$</span>
            <input type="number" id="editPrecio" name="precio" step="0.01" min="0" inputmode="decimal">
            <span aria-hidden="true" class="suffix">MXN</span>
          </div>
        </div>

        <div class="form-group span-2">
          <label for="editDescripcion">Descripción</label>
          <textarea id="editDescripcion" name="descripcion" rows="3" required maxlength="1000"></textarea>
          <small class="char-count" data-for="editDescripcion" aria-live="polite"></small>
        </div>

        <div class="form-group span-2">
          <label for="editArchivo">Reemplazar archivo <span class="optional">(opcional)</span></label>
          <div class="dropzone">
            <input type="file" id="editArchivo" name="archivo"
                   accept="image/jpeg,image/png,image/webp,video/mp4,application/pdf">
            <div class="file-preview" id="editFilePreview" hidden></div>
          </div>
        </div>

        <div class="form-actions span-2">
          <button type="button" id="btnCancelEdit" class="btn btn-ghost">Cancelar</button>
          <button type="submit" id="btnSaveEdit" class="btn btn-primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notificaciones -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="admin.js?v=4.0" defer></script>
</body>
</html>
