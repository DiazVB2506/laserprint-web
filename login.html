<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaserPrint - Iniciar Sesión</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Luces neón de fondo -->
  <div class="bg-glow ambient-cyan"></div>
  <div class="bg-glow ambient-magenta"></div>

  <!-- Contenedor en 2 columnas (Izquierda: Logo | Derecha: Login) -->
  <main class="login-split-container">

    <!-- COLUMNA IZQUIERDA: LOGO GRANDE Y MARCA -->
    <section class="brand-side">
      <a href="index.html" class="logo-hero-link">
        <img 
          src="uploads/fotos/LOGOTIPO.png" 
          alt="Diseño Laser Print Logo" 
          class="hero-logo-img"
          onerror="this.onerror=null; this.src='/uploads/fotos/LOGOTIPO.png';"
        >
      </a>
      <h1 class="brand-title-outside">LASERPRINT</h1>
      <p class="brand-quote-outside">"Transformando ideas en impresiones de alta precisión."</p>
    </section>

    <!-- COLUMNA DERECHA: PANEL DE ACCESO -->
    <section class="form-side">
      <div class="card">
        <div class="card2">
          <form class="form" id="loginForm">

            <h2 id="heading">Panel de Acceso</h2>

            <!-- Alertas -->
            <div id="alertMessage" class="alert-message"></div>

            <!-- Campo Usuario -->
            <div class="field">
              <svg class="input-icon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <input 
                type="text" 
                id="usuario" 
                class="input-field" 
                placeholder="Usuario" 
                required 
                autocomplete="off"
              >
            </div>

            <!-- Campo Contraseña -->
            <div class="field">
              <svg class="input-icon" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
              <input 
                type="password" 
                id="password" 
                class="input-field" 
                placeholder="Contraseña" 
                required
              >
            </div>

            <!-- Botón Entrar -->
            <div class="btn">
              <button type="submit" class="button1" id="btnLogin">Entrar</button>
            </div>

            <a href="index.html" class="button-back">← Volver al sitio principal</a>

          </form>
        </div>
      </div>
    </section>

  </main>

  <script src="login.js"></script>
</body>
</html>
